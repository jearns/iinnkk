<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手筆 · 名帖管理</title><style>body{margin:0;background:#f5f0e6;color:#433c31;font:14px/1.6 system-ui}main{max-width:900px;margin:auto;padding:20px}header,nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header a{color:inherit}h1{font-size:21px;margin:10px 0}label{display:flex;flex-direction:column;gap:4px}input,select,textarea,button{font:inherit;box-sizing:border-box;padding:8px;border:1px solid #b8ac93;border-radius:6px;background:#fffaf1;color:inherit}textarea{min-height:90px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.wide{grid-column:1/-1}button{cursor:pointer}button.primary{background:#9f3428;color:white}#preview{display:flex;gap:8px;overflow:auto}#preview img{height:120px;max-width:180px;object-fit:contain}small{color:#716854}#status{white-space:pre-wrap;min-height:24px}input[type=password]{width:min(100%,500px)}@media(max-width:520px){form{grid-template-columns:1fr}main{padding:12px}}#coverEditor244{margin:24px 0;border-block:1px solid #b8ac9355;padding:16px 0}#coverEditor244 h2{font-size:17px}#coverViewport244{width:min(100%,400px);height:210px;overflow:hidden;background:#e9dfcc;border:5px solid #fff6;margin:12px 0}#coverViewport244{touch-action:none;cursor:grab;outline-offset:3px}#coverViewport244.cropping245{cursor:grabbing}#coverPreview244{user-select:none;-webkit-user-drag:none;width:100%;height:100%;object-fit:cover}#coverSliders244{display:flex;gap:12px;flex-wrap:wrap}#coverSliders244 label{width:130px}#coverEditor244 select{max-width:100%}</style><main><header><a href="./">← 首页</a><h1>名帖管理</h1></header><p>无需 Supabase 登录。草稿保存在本机；发布全站内容须通过 GitHub 仓库写入授权。</p><nav><select id="catalogue" aria-label="选择名帖"></select><button id="new">新增名帖</button><button id="restore">恢复草稿</button></nav><form id="editor"></form><label>添加原帖图片<input id="images" type="file" accept="image/*" multiple></label><small>新增图片会追加至原帖组图；每张自动压缩。请确认使用授权和来源。</small><div id="preview"></div><section id="coverEditor244"><h2>名帖封面</h2><label>选择封面<select id="coverSelect244"></select></label><label>替换封面<input id="coverUpload244" type="file" accept="image/*"></label><p>拖动移位 · 双指或滚轮缩放</p><div id="coverViewport244" tabindex="0" role="group" aria-label="封面裁切，可拖动或缩放"><img id="coverPreview244" alt="封面预览"></div><div id="coverSliders244"></div><button id="coverReset244" type="button">重置裁切</button></section><label>原有组图（每行一个地址）<textarea id="pages"></textarea></label><label><span><input id="deleted" type="checkbox">下架此条目（可恢复）</span></label><nav><button id="save">保存草稿</button><button id="export">导出修改包</button></nav><details><summary>发布到 GitHub</summary><p>填写仅有 jearns/iinnkk 内容读写权限的 GitHub 令牌；仅本页内存使用，不保存。发布会更新全站目录。</p><input id="token" type="password" autocomplete="off" placeholder="GitHub 写入令牌" aria-label="GitHub 写入令牌"><button id="publish" class="primary">发布全站</button></details><p id="status" role="status"></p><script defer src="i18n218.js?v=245"></script><script src="cover-crop145.js"></script><script src="cover-gestures245.js"></script><script src="manage234.js?v=245"></script></main></html>

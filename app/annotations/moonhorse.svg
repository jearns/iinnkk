    <radialGradient id="moon"><stop stop-color="#fff7de"/><stop offset=".74" stop-color="#f8e9be"/><stop offset="1" stop-color="#d9bf84"/></radialGradient>
    <linearGradient id="blank" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#f7f0df"/></linearGradient>

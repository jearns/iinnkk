<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">每个角落，都有亲笔的声音</title><desc id="desc">毛笔勾勒地球，山村、海岛、街巷和远方的人留下笔迹，汇成向世界的问好。</desc><defs><radialGradient id="paper"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#e7e2ce"/></radialGradient></defs><style>.line{fill:none;stroke:#314b3e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1500;stroke-dashoffset:1500;animation:write 5s ease forwards}.fine{stroke-width:1.3;opacity:.4}.voices{animation:appear 2s 2s both}text{font-family:KaiTi,serif;fill:#314b3e}@keyframes write{to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}.voices{animation:none}}</style><rect width="640" height="640" rx="320" fill="url(#paper)"/><g class="line"><path d="M511 324c0 112-83 203-194 204C202 529 113 442 114 328c1-116 86-209 202-211 113-1 200 95 195 207Z"/><path class="fine" d="M119 288c117-68 270-70 387 0M120 374c120 53 257 59 383 0M316 119c-117 119-114 291 0 406M319 119c111 115 117 293 0 406M319 119v405"/><path d="m154 260 43-36 48 12 20 33-24 33-5 58-34 17-28-55-24-9m161-116 48-15 32 23 54 9 22 43-37 21-12 50-46 6-9 55-30 8-23-63 11-44-37-27m101 143 29-12 33 26-18 24-35-5"/></g><g class="voices"><g fill="#a44d36"><circle cx="178" cy="234" r="7"/><circle cx="444" cy="293" r="7"/><circle cx="253" cy="390" r="7"/><circle cx="412" cy="433" r="7"/></g><g font-size="26"><text x="63" y="194">山村 · 你好</text><text x="427" y="254">街巷 · Hello</text><text x="55" y="437">海岛 · Bonjour</text><text x="426" y="480">远方 · Hola</text></g><path d="M153 202l25 25m285 35-18 25M204 424l42-27m204 72-32-29" stroke="#a44d36" fill="none" stroke-width="2"/><text x="320" y="574" text-anchor="middle" font-size="29">你在哪里，世界就多一笔。</text><text x="320" y="607" text-anchor="middle" font-size="15" letter-spacing="4">今日亲笔 · 问好世界</text></g></svg>